<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DZYR Technology — Site Launching Soon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-a: #060a16;
    --bg-b: #0a1226;
    --bg-c: #0d1c33;
    --ink: #f4f6fa;
    --accent: #2fb3e8;
    --muted: #93a3b8;
  }

  *{box-sizing:border-box;}

  html,body{
    margin:0;
    min-height:100%;
    background:var(--bg-a);
  }

  body{
    position:relative;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family: 'Poppins', 'Segoe UI', system-ui, -apple-system, sans-serif;
    color:var(--ink);
    overflow-x:hidden;
    padding: 48px 20px;
  }

  /* Base gradient wash */
  .bg{
    position:fixed;
    inset:0;
    z-index:0;
    background:
      radial-gradient(ellipse 80% 55% at 30% 10%, rgba(47,179,232,0.09), transparent 60%),
      radial-gradient(ellipse 70% 50% at 75% 90%, rgba(90,60,200,0.10), transparent 60%),
      linear-gradient(160deg, var(--bg-a) 0%, var(--bg-b) 45%, var(--bg-c) 100%);
  }

  /* Visible rounded-square tile mosaic */
  .mosaic{
    position:fixed;
    inset:0;
    z-index:1;
    background-image:
      repeating-linear-gradient(90deg,
        rgba(35,55,90,0.55) 0px, rgba(35,55,90,0.55) 16px,
        transparent 16px, transparent 22px),
      repeating-linear-gradient(0deg,
        rgba(35,55,90,0.55) 0px, rgba(35,55,90,0.55) 16px,
        transparent 16px, transparent 22px);
    background-size: 22px 22px;
    opacity: 0.9;
    -webkit-mask-image: radial-gradient(ellipse 90% 90% at 50% 40%, black 40%, transparent 92%);
    mask-image: radial-gradient(ellipse 90% 90% at 50% 40%, black 40%, transparent 92%);
  }

  .mosaic::after{
    content:"";
    position:absolute;
    inset:0;
    background-image: repeating-conic-gradient(
      from 0deg,
      rgba(20,35,65,0.35) 0deg 90deg,
      rgba(14,26,50,0.2) 90deg 180deg
    );
    background-size: 44px 44px;
    mix-blend-mode: overlay;
  }

  /* Scattered sparkle dots */
  .sparkles{
    position:fixed;
    inset:0;
    z-index:1;
    pointer-events:none;
  }

  .spark{
    position:absolute;
    border-radius:50%;
    animation: twinkle 4s ease-in-out infinite;
  }

  @keyframes twinkle{
    0%, 100% { opacity: 0.25; transform: scale(0.85); }
    50% { opacity: 1; transform: scale(1.15); }
  }

  /* Vignette so text stays readable */
  .vignette{
    position:fixed;
    inset:0;
    z-index:1;
    background: radial-gradient(ellipse 65% 60% at 50% 42%, rgba(6,10,20,0) 0%, rgba(6,10,20,0.55) 65%, rgba(6,10,20,0.9) 100%);
  }

  main{
    position:relative;
    z-index:2;
    text-align:center;
    max-width: 820px;
    width:100%;
  }

  .eyebrow{
    margin-bottom: clamp(16px, 3vw, 24px);
    display:flex;
    justify-content:center;
  }

  .eyebrow img{
    height: clamp(16px, 2.6vw, 24px);
    width: auto;
    display:block;
  }

  h1{
    font-size: clamp(28px, 6vw, 54px);
    line-height: 1.18;
    font-weight: 600;
    margin: 0 0 clamp(28px, 5vw, 40px);
    letter-spacing: -0.01em;
  }

  h1 .bright{
    color: var(--ink);
  }

  h1 .powering{
    color: var(--accent);
    font-weight: 500;
    text-shadow: 0 0 26px rgba(47,179,232,0.5);
  }

  .status{
    font-size: clamp(12px, 1.8vw, 14px);
    letter-spacing: 0.14em;
    color: var(--muted);
    font-weight: 400;
    margin-bottom: clamp(40px, 7vw, 60px);
  }

  /* Logo — desire advertising LLC */
  .logo-slot{
    min-height: 40px;
    margin-bottom: clamp(18px, 4vw, 28px);
    display:flex;
    justify-content:center;
  }

  .logo-slot img{
    height: clamp(34px, 6vw, 52px);
    width: auto;
    display:block;
  }

  /* Single-line dot animation strip, sits below the logo */
  .dot-strip{
    display:flex;
    align-items:center;
    justify-content:center;
    gap: clamp(6px, 1.4vw, 12px);
    flex-wrap: nowrap;
    max-width: 100%;
    overflow: hidden;
    padding: 4px;
    margin-bottom: clamp(20px, 4vw, 30px);
  }

  .dot{
    width: clamp(9px, 1.8vw, 14px);
    height: clamp(9px, 1.8vw, 14px);
    border-radius: 4px;
    background: rgba(60, 90, 130, 0.4);
    flex: 0 0 auto;
    animation: dotGlow 2.6s ease-in-out infinite;
  }

  @keyframes dotGlow{
    0%, 100% {
      background: rgba(60, 90, 130, 0.35);
      box-shadow: none;
    }
    50% {
      background: var(--glow-c, #35e8f0);
      box-shadow: 0 0 12px 2px var(--glow-c, #35e8f0);
    }
  }

  @media (max-width: 480px){
    .dot-strip{ gap: 6px; }
  }

  @media (prefers-reduced-motion: reduce){
    .dot{ animation: none; }
    .spark{ animation: none; }
  }
</style>
</head>
<body>

  <div class="bg"></div>
  <div class="mosaic"></div>
  <div class="sparkles" id="sparkles"></div>
  <div class="vignette"></div>

  <main>
    <div class="eyebrow">
      <img src="assets/dzyr-logo.png" alt="DZYR Technology — LED & AV Solutions">
    </div>
    <h1>
      <span class="bright">Something bright</span><br>
      is <span class="powering">powering up.</span>
    </h1>
    <div class="status">SITE LAUNCHING SOON</div>

    <div class="dot-strip" id="dotStrip"></div>

    <div class="logo-slot">
      <img src="assets/desire-logo.png" alt="Desire Advertising LLC">
    </div>
  </main>

<script>
  /* Scattered sparkle dots, like the reference image */
  const sparkleLayer = document.getElementById('sparkles');
  const sparkColors = ['#35e8f0', '#4fd1c5', '#8b7ff0', '#5ad0f5', '#ffffff'];

  function buildSparkles(){
    sparkleLayer.innerHTML = '';
    const area = window.innerWidth * window.innerHeight;
    const count = Math.max(30, Math.min(90, Math.round(area / 14000)));

    for (let i = 0; i < count; i++){
      const s = document.createElement('div');
      s.className = 'spark';
      const size = (Math.random() * 2.6 + 1.4).toFixed(1);
      const color = sparkColors[Math.floor(Math.random() * sparkColors.length)];
      s.style.width = size + 'px';
      s.style.height = size + 'px';
      s.style.left = (Math.random() * 100) + '%';
      s.style.top = (Math.random() * 100) + '%';
      s.style.background = color;
      s.style.boxShadow = `0 0 ${(size * 2.5).toFixed(1)}px ${color}`;
      s.style.animationDelay = (Math.random() * 4).toFixed(2) + 's';
      s.style.animationDuration = (3 + Math.random() * 3).toFixed(2) + 's';
      sparkleLayer.appendChild(s);
    }
  }

  buildSparkles();

  /* Single-line dot animation strip */
  const strip = document.getElementById('dotStrip');
  const glowColors = ['#35e8f0', '#3b8ff0', '#4a3fb0', '#2fb3e8', '#5ad0f5'];

  function dotCountForWidth(){
    const w = window.innerWidth;
    if (w < 420) return 9;
    if (w < 640) return 12;
    if (w < 960) return 16;
    return 20;
  }

  function buildStrip(){
    strip.innerHTML = '';
    const count = dotCountForWidth();
    for (let i = 0; i < count; i++){
      const d = document.createElement('div');
      d.className = 'dot';
      d.style.setProperty('--glow-c', glowColors[Math.floor(Math.random() * glowColors.length)]);
      d.style.animationDelay = (Math.random() * 2.6).toFixed(2) + 's';
      strip.appendChild(d);
    }
  }

  buildStrip();

  let resizeTimer;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => {
      buildStrip();
      buildSparkles();
    }, 250);
  });
</script>

</body>
</html>
